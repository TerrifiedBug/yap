name: release

# Build, Developer ID-sign, notarize and publish a yap .dmg on every v* tag.
# Mirrors scripts/build-release.sh, so a local run and a CI run produce the same
# artifact. One Developer ID Application cert covers both the .app and the .dmg;
# no Installer cert is needed.
#
# Required secrets, all on the `release` environment:
#   DEVELOPER_ID_APP_P12_BASE64  base64 of the Developer ID Application .p12
#   DEV_ID_P12_PASSWORD          password for that .p12
#   APP_IDENTITY                 "Developer ID Application: NAME (TEAMID)"
#   NOTARY_KEY_P8_BASE64         base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID                App Store Connect key id
#   NOTARY_ISSUER_ID             App Store Connect issuer id
#   HOMEBREW_TAP_DEPLOY_KEY      ssh deploy key with write access to TerrifiedBug/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # The signing secrets live in this environment, which is restricted to v*
    # tags. Nothing else in a public repo — no PR, no other workflow, no other
    # ref — can read the Developer ID key.
    environment: release
    timeout-minutes: 45
    steps:
      # This job imports the Developer ID private key, so every action is
      # pinned to a full commit SHA. A mutable tag could be moved to code that
      # exfiltrates it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source version matches tag
        run: |
          grep -qF 'version: "${{ steps.v.outputs.version }}"' Sources/yap/Yap.swift \
            || { echo "Sources/yap/Yap.swift version literal != ${{ steps.v.outputs.version }} — bump it first" >&2; exit 1; }

      # Before the twenty minutes of build and notarization, so a release with
      # no notes fails in seconds rather than after Apple has stamped it.
      # Notes are written by hand: the generated list of PR titles says what
      # was merged, which is not the same as what changed for the person
      # installing it.
      - name: Read the release notes
        id: notes
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v want="## $V" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # -s rather than -f: an empty section is the same mistake as a
          # missing one, and both should stop the release.
          [ -s notes.md ] || {
            echo "CHANGELOG.md has no '## $V' section — write the notes first" >&2
            exit 1
          }
          {
            echo 'body<<YAPNOTES'
            cat notes.md
            echo 'YAPNOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import signing certificate
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

      - name: Store notary credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials yap-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize
        env:
          VERSION: ${{ steps.v.outputs.version }}
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
          NOTARY_PROFILE: yap-notary
        run: ./scripts/build-release.sh

      - name: Checksum
        id: pkg
        working-directory: dist
        run: |
          V="${{ steps.v.outputs.version }}"
          shasum -a 256 "yap-$V.dmg" > "yap-$V.dmg.sha256"
          # The in-app updater fetches this one and compares it against the zip
          # before it unpacks anything.
          shasum -a 256 "yap-$V.zip" > "yap-$V.zip.sha256"
          echo "sha256=$(shasum -a 256 "yap-$V.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/yap-${{ steps.v.outputs.version }}.dmg
            dist/yap-${{ steps.v.outputs.version }}.dmg.sha256
            dist/yap-${{ steps.v.outputs.version }}.zip
            dist/yap-${{ steps.v.outputs.version }}.zip.sha256
          # Both: GitHub puts `body` first and appends its own list of merged
          # pull requests and the full-changelog link underneath, so the notes
          # lead and the provenance is still one click away.
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Last, so a failed build or a failed notarization never points the tap
      # at a release that does not exist.
      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          # A deploy key rather than a personal token: it can write to this one
          # repository and nothing else, so the blast radius of the release job
          # leaking it is one tap.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "ssh://git@github.com/TerrifiedBug/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap" || exit 1
          cat > Casks/yap.rb <<CASKEOF
          cask "yap" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/TerrifiedBug/yap/releases/download/v#{version}/yap-#{version}.dmg"
            name "yap"
            desc "On-device dictation and meeting transcription"
            homepage "https://github.com/TerrifiedBug/yap"

            # Parakeet runs on the Apple Neural Engine; there is no Intel build.
            depends_on arch: :arm64
            depends_on macos: :sequoia

            app "yap.app"
            # No "binary" stanza. yap is a menu-bar app; the only subcommand
            # left is "bench", which is a development tool, and putting a
            # second path to the same executable on PATH is how the daemon
            # ended up with two LaunchServices identities in the first place.

            # Homebrew replaces /Applications/yap.app, but a process keeps the
            # image it already mapped. Without this you stay on the old version
            # until something restarts the daemon, while "yap --version" reads
            # the new binary on disk and agrees with the version you just
            # installed — the worst shape for a bug, because it looks fixed.
            #
            # The rewrite first, and it is not cosmetic. yap 0.2's plist ran
            # "yap run --skip-doctor", an argument 0.3 does not take: launchd
            # would start it, ArgumentParser would exit 64, KeepAlive would
            # relaunch it, and the login item would spin for ever. Nothing but
            # this line and yap itself ever rewrites that file.
            #
            # bootout + bootstrap rather than "kickstart -k", because launchd
            # reads a plist when the job is bootstrapped and not again — a
            # kickstart would faithfully relaunch the arguments it already had
            # in memory, rewritten file or not.
            #
            # Measured, because the alternative is losing someone's meeting:
            # bootout delivers SIGTERM, not SIGKILL, and yap catches SIGTERM
            # and routes it through applicationWillTerminate. So a recording in
            # flight is finalized and transcribes on the next start instead of
            # losing its meta.json.
            #
            # must_succeed: false throughout because an install with no login
            # item has no job to restart, and launchctl exits 113 there. Not
            # having asked for launch-at-login is not a reason to fail an
            # upgrade.
            postflight do
              agent = File.expand_path("~/Library/LaunchAgents/com.terrifiedbug.yap.plist")
              next unless File.exist?(agent)

              system_command "/usr/bin/plutil",
                             args:         ["-replace", "ProgramArguments", "-json",
                                            %Q(["#{appdir}/yap.app/Contents/MacOS/yap", "run"]),
                                            agent],
                             must_succeed: false
              system_command "/bin/launchctl",
                             args:         ["bootout", "gui/#{Process.uid}/com.terrifiedbug.yap"],
                             must_succeed: false
              system_command "/bin/launchctl",
                             args:         ["bootstrap", "gui/#{Process.uid}", agent],
                             must_succeed: false
            end

            # No uninstall stanza at all, and both halves of that are
            # deliberate. Homebrew runs these directives on upgrade as well as
            # uninstall: "launchctl" deletes
            # ~/Library/LaunchAgents/<label>.plist, so every upgrade would
            # quietly switch launch-at-login off, and "quit" is recorded and
            # then reopened with "open -b" afterwards, which would start the
            # daemon outside launchd where the login item cannot reach it.
            #
            # Neither is a loss, because the cask never started the daemon.
            # The "Launch at login" toggle in Settings did, and it owns
            # stopping it.

            # zap only runs on "brew uninstall --zap", which is the one time
            # taking the login item away is what was asked for. launchctl
            # deletes the plist itself, so it is not repeated under trash.
            #
            # Not the models: they live in FluidAudio's machine-global cache,
            # shared with every other FluidAudio client, so removing them here
            # would cost someone else a 220 MB download.
            zap launchctl: "com.terrifiedbug.yap",
                trash:     [
                  "~/.config/yap",
                  "~/Library/Logs/yap",
                ]

            caveats <<~CAVEAT
              Launch yap from Applications. It asks for the permissions it
              needs from the menu bar, and downloads the model in the
              background on first run.

              To remove everything, including the login item:
                brew uninstall --zap --cask yap
            CAVEAT
          end
          CASKEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/yap.rb
          git commit -m "Update yap to $VERSION" || echo "No changes"
          git push
